name: Sync README files

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'profile/README.md'
  pull_request:
    paths:
      - 'README.md'
      - 'profile/README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme:
    name: Sync README.md and profile/README.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify / Sync README files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if ! cmp -s README.md profile/README.md; then
              echo "::error::README.md and profile/README.md are out of sync! Please make sure both files are identical."
              diff -u README.md profile/README.md
              exit 1
            fi
            echo "Both README files are in sync."
            exit 0
          fi

          # On push or workflow_dispatch:
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" HEAD)
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED=""
          fi

          if echo "$CHANGED" | grep -qx "profile/README.md" && ! echo "$CHANGED" | grep -qx "README.md"; then
            echo "profile/README.md was updated; syncing to README.md"
            cp profile/README.md README.md
          elif echo "$CHANGED" | grep -qx "README.md" && ! echo "$CHANGED" | grep -qx "profile/README.md"; then
            echo "README.md was updated; syncing to profile/README.md"
            cp README.md profile/README.md
          elif ! cmp -s README.md profile/README.md; then
            echo "Files differ; defaulting profile/README.md as source of truth"
            cp profile/README.md README.md
          else
            echo "Files are already in sync; nothing to do."
          fi

      - name: Commit and push changes
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md profile/README.md
            git commit -m "chore: synchronize README.md and profile/README.md [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
